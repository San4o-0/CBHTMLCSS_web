<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>4.6 Повторне використання стилів</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 24px;
      }

      .btn {
        padding: 8px 16px;
        border: 1px solid #2563eb;
        border-radius: 8px;
        font: inherit;
        cursor: pointer;
      }

      .btn-primary {
        background-color: #2563eb;
        color: #ffffff;
      }

      .btn-outline {
        background-color: transparent;
        color: #2563eb;
      }
    </style>
  </head>
  <body>
    <h1>4.6 Повторне використання стилів</h1>
    <button class="btn btn-primary" type="button">Primary</button>
    <button class="btn btn-outline" type="button">Outline</button>
  </body>
</html>
