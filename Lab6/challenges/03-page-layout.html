<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Challenge 3 — Responsive page layout: Grid + Flexbox</title>
    <link rel="stylesheet" href="../base.css" />
    <style>
      body {
        padding: 0;
      }

      /* ---------- Каркас сторінки: Grid ---------- */

      /* Мобільний порядок: Header → Main → Sidebar → Footer (як у DOM) */
      .page {
        display: grid;
        grid-template-areas:
          'header'
          'main'
          'sidebar'
          'footer';
        grid-template-rows: auto 1fr auto auto;
        gap: 16px;
        min-block-size: 100dvh;
        max-inline-size: 75rem;
        margin-inline: auto;
        padding: 16px;
      }

      /*
        Єдиний breakpoint: це зміна СТРУКТУРИ сторінки (sidebar переїжджає ліворуч),
        її не виразити «гнучкою» властивістю. 48rem — ширина, з якої sidebar
        отримує ≥ 12rem і не стискає main.
      */
      @media (width >= 48rem) {
        .page {
          grid-template-areas:
            'header header'
            'sidebar main'
            'footer footer';
          grid-template-columns: minmax(12rem, 1fr) 3fr;
          grid-template-rows: auto 1fr auto;
        }
      }

      .page-header {
        grid-area: header;
      }

      .page-main {
        grid-area: main;
        min-inline-size: 0;
      }

      .page-sidebar {
        grid-area: sidebar;
      }

      .page-footer {
        grid-area: footer;
      }

      .page-header,
      .page-main,
      .page-sidebar,
      .page-footer {
        padding: 16px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background-color: var(--surface);
      }

      /* ---------- Компоненти: Flexbox ---------- */

      .page-header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px 24px;
      }

      .logo {
        color: var(--accent);
        font-size: 1.25rem;
        font-weight: 700;
        text-decoration: none;
      }

      .nav {
        display: flex;
        flex: 1 1 18rem;
        flex-wrap: wrap;
        gap: 4px 20px;
      }

      .nav a {
        color: inherit;
        text-decoration: none;
      }

      .nav a[aria-current='page'] {
        color: var(--accent);
        font-weight: 600;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .button {
        padding-block: 8px;
        padding-inline: 14px;
        border: 1px solid var(--accent);
        border-radius: 6px;
        background-color: transparent;
        color: var(--accent);
        font: inherit;
        cursor: pointer;
      }

      .button--primary {
        background-color: var(--accent);
        color: #fff;
      }

      .main-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-block-end: 16px;
      }

      .main-head h1 {
        margin: 0;
      }

      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(14rem, 100%), 1fr));
        gap: 12px;
      }

      .card {
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background-color: var(--bg);
      }

      .card h2 {
        margin-block: 0 4px;
        font-size: 1rem;
      }

      .card p {
        margin: 0;
        color: var(--text-muted);
      }

      .page-sidebar h2 {
        margin-block: 0 8px;
        font-size: 1rem;
      }

      .filters {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .page-footer {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 8px;
        color: var(--text-muted);
        font-size: 0.9rem;
      }

      .page-footer p {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="page-header">
        <a class="logo" href="./">WebLab</a>
        <nav class="nav" aria-label="Основна навігація">
          <a href="#" aria-current="page">Projects</a>
          <a href="#">Team</a>
          <a href="#">Reports</a>
          <a href="#">Settings</a>
        </nav>
        <div class="actions">
          <button class="button" type="button">Log in</button>
          <button class="button button--primary" type="button">Sign up</button>
        </div>
      </header>

      <main class="page-main">
        <div class="main-head">
          <h1>Projects</h1>
          <div class="actions">
            <button class="button" type="button">Export</button>
            <button class="button button--primary" type="button">New project</button>
          </div>
        </div>
        <div class="cards">
          <article class="card">
            <h2>Landing page</h2>
            <p>Responsive layout на Grid і Flexbox.</p>
          </article>
          <article class="card">
            <h2>Dashboard</h2>
            <p>Сітка карток з auto-fit.</p>
          </article>
          <article class="card">
            <h2>Blog</h2>
            <p>Fluid typography з clamp().</p>
          </article>
          <article class="card">
            <h2>Shop</h2>
            <p>Картки товарів з container queries.</p>
          </article>
        </div>
      </main>

      <aside class="page-sidebar" aria-label="Фільтри">
        <h2>Фільтри</h2>
        <ul class="filters">
          <li>
            <label><input type="checkbox" checked /> Активні</label>
          </li>
          <li>
            <label><input type="checkbox" /> Архівні</label>
          </li>
          <li>
            <label><input type="checkbox" /> Мої</label>
          </li>
        </ul>
      </aside>

      <footer class="page-footer">
        <p>WebLab — Challenge 3</p>
        <p><a href="./">← Усі challenges</a></p>
      </footer>
    </div>
  </body>
</html>
